<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Neon Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Seamless Gradient -->
    <linearGradient id="neonGradient" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>
  </defs>

  <g filter="url(#neonGlow)">
    <g fill="url(#neonGradient)">
        <!-- Left Stem (Path)
             Top: 20.
             Left: 110. Right: 190.
             Right side goes straight down to 400 (center of note head).
             Left side curves to meet top of note head.
             Note Head Top is roughly 400-70 = 330.
             So we curve from 110,300 to something on the ellipse.
             Ellipse at x=110 is simply y = 400 - 70*sqrt(1 - ((110-100)/90)^2).
             ((110-100)/90)^2 = (10/90)^2 = 1/81. sqrt(80/81) approx 1.
             So it meets near the top.
        -->
        <path d="M 110 20 H 190 V 400 L 110 400 V 20 Z" /> 
        <!-- Wait, L 110 400 is center. The stem needs to merge. 
             If I just draw the rect down to 400, it overlaps the ellipse which is fine since fill is unified.
             Rect: 110, 20, 80, 380.
        -->
        <rect x="110" y="20" width="80" height="380" />
        
        <!-- Right Stem (Rect)
             362, 20, 80, 380.
        -->
        <rect x="362" y="20" width="80" height="380" />


        <!-- Crossbar (Rect)
             Raised to y=180.
        -->
        <rect x="190" y="180" width="172" height="60" />
        
        <!-- Left Note Head (Ellipse)
             Center: 100 (Shifted to align with stem left).
             Rx: 90. Ry: 70.
             No Rotation.
             Right Edge: 100+90 = 190. Matches Stem Right (190).
        -->
        <ellipse cx="100" cy="400" rx="90" ry="70" />
        
        <!-- Right Note Head (Ellipse)
             Center: 352.
             Rx: 90. Ry: 70.
             Right Edge: 352+90 = 442. Matches Stem Right (442).
        -->
        <ellipse cx="352" cy="400" rx="90" ry="70" />
        
        <!-- Left Flag (Path)
             Attached to 190, 20.
        -->
        <path d="M 190 20 
                 Q 250 20, 250 80 
                 Q 250 50, 190 80 
                 Z" />

        <!-- Right Flag (Path)
             Attached to 442, 20.
        -->
        <path d="M 442 20 
                 Q 502 20, 502 80 
                 Q 502 50, 442 80 
                 Z" />
    </g>
  </g>
</svg>
