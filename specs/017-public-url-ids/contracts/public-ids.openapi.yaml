openapi: 3.0.3
info:
  title: HitGuessr Public ID Contract
  version: 1.0.0
  description: |
    Contract for public access to Team and Game resources using public IDs only.
servers:
  - url: /
paths:
  /teams/{team_public_id}:
    get:
      summary: Get team by public ID
      parameters:
        - in: path
          name: team_public_id
          required: true
          schema:
            type: string
            pattern: '^tm_[A-Za-z0-9]{8}$'
      responses:
        '200':
          description: Team page/resource resolved
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}:
    get:
      summary: Get game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
      responses:
        '200':
          description: Game page/resource resolved
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}/proposals/new:
    get:
      summary: Render proposal form for a game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
      responses:
        '200':
          description: Proposal form rendered
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}/proposals:
    post:
      summary: Create proposal for a game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
      responses:
        '302':
          description: Redirect after successful proposal create
        '422':
          description: Validation error
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}/proposals/{proposal_id}:
    get:
      summary: Get proposal for a game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
        - in: path
          name: proposal_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal page/resource resolved
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}/guesses/new:
    get:
      summary: Render guess form for a game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
      responses:
        '200':
          description: Guess form rendered
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}/guesses:
    post:
      summary: Create guess for a game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
      responses:
        '302':
          description: Redirect after successful guess create
        '422':
          description: Validation error
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{game_public_id}/results:
    get:
      summary: Get results for a game by public ID
      parameters:
        - in: path
          name: game_public_id
          required: true
          schema:
            type: string
            pattern: '^gm_[A-Za-z0-9]{8}$'
      responses:
        '200':
          description: Results page/resource resolved
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{team_public_id}/games:
    get:
      summary: List games for a team by team public ID
      parameters:
        - in: path
          name: team_public_id
          required: true
          schema:
            type: string
            pattern: '^tm_[A-Za-z0-9]{8}$'
      responses:
        '200':
          description: Team games listed
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create game under a team identified by public ID
      parameters:
        - in: path
          name: team_public_id
          required: true
          schema:
            type: string
            pattern: '^tm_[A-Za-z0-9]{8}$'
      responses:
        '302':
          description: Redirect to created game page (public ID URL)
        '422':
          description: Validation error
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Resource not found or invalid public ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicIdError'
  schemas:
    PublicIdError:
      type: object
      properties:
        error:
          type: string
          example: not_found
      required: [error]
