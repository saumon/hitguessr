openapi: 3.0.3
info:
  title: HitGuessr - Minimum Team Members to Start Game
  version: 1.0.0
  description: |
    Contract for creating a game with an additional mandatory rule:
    a team must have at least 3 active/confirmed members (existing memberships).
servers:
  - url: http://localhost:3000
paths:
  /teams/{team_id}/games:
    post:
      summary: Start a new game for a team
      description: |
        Creates a game only if all existing launch rules are satisfied,
        including the minimum threshold of 3 members.
      tags:
        - games
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: integer
          description: Target team identifier
      responses:
        '302':
          description: HTML redirect after request handling
          headers:
            Location:
              schema:
                type: string
              description: Success redirects to game page; refusal redirects to new team game page
          content:
            text/html:
              schema:
                type: string
              examples:
                success:
                  summary: Eligible team
                  value: Redirect with success flash message
                refusedMinimumMembers:
                  summary: Team has fewer than 3 members
                  value: Redirect/render with explicit minimum-members message
        '401':
          description: Unauthenticated user
        '403':
          description: Authenticated user is not team organizer
        '404':
          description: Team not found or not accessible
        '422':
          description: Validation failure (e.g., other existing launch constraints)
      security:
        - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: _hitguessr_session
x-business-rules:
  - "BR-001: Team must have >= 3 active/confirmed members (existing memberships)."
  - "BR-002: Threshold check must happen server-side in the same transaction as game creation."
  - "BR-003: No game record is created when threshold is not met."
  - "BR-004: Existing launch rules remain mandatory (organizer authorization, one active game max, etc.)."
  - "BR-005: Threshold value is fixed to 3 and is not configurable in this feature."
x-user-feedback:
  refusalMessageKey: "games.create.minimum_members_required"
  successMessageKey: "games.create.success"
  refusalMessageFrExample: "Au moins 3 membres sont requis pour lancer une partie."
  successMessageFrExample: "Partie lancée ! Les joueurs peuvent maintenant soumettre leurs propositions."
