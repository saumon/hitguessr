# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  games:
    create:
      success: "Game started successfully."
      minimum_members_required: "At least %{count} team members are required to start a game."
      minimum_members_hint: "At least %{count} members required"
      active_game_in_progress: "A game is already in progress"
    destroy:
      success: "Game cancelled successfully."
      error: "An error occurred while cancelling the game."
      cannot_cancel_finished: "Cannot cancel a finished game."
      confirm: "Are you sure you want to cancel this game? This action cannot be undone."
  teams:
    leave_action:
      label: "Leave team"
      confirmation: "Are you sure you want to leave this team?"
    leaderboard:
      title: "Overall Leaderboard"
      empty: "No leaderboard available. Finish some games to see the leaderboard."
  hello: "Hello world"
